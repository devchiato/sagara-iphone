
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagara's iPhone</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #211b17;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  overflow: hidden;
}

.lock-screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: #54463b url("wallpaper.png") center / cover no-repeat;
}

.lock-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    #160f0c66 0%,
    #160f0c10 30%,
    #160f0c12 65%,
    #160f0c55 100%
  );
}

/* STATUS BAR */
.status-bar {
  position: absolute;
  top: max(env(safe-area-inset-top), 14px);
  left: 7.5%;
  right: 7.5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 5px #0008;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 14px;
}

.signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 14px; }

.wifi {
  width: 19px;
  height: 15px;
}

.battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2.5px;
  height: 4px;
  background: white;
}

.battery-fill {
  display: block;
  width: 76%;
  height: 100%;
  background: white;
}

/* CLOCK */
.clock-area {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12vh);
  left: 0;
  right: 0;
  text-align: center;
  text-shadow: 0 2px 12px #0005;
}

.date {
  font-size: clamp(16px, 4.4vw, 23px);
  font-weight: 450;
}

.clock {
  margin-top: 14px;
  font-size: clamp(92px, 25vw, 138px);
  line-height: .98;
  font-weight: 200;
  letter-spacing: -6px;
  font-variant-numeric: tabular-nums;
}

/* WHATSAPP NOTIFICATION */
.notification {
  position: absolute;
  top: 38.5%;
  left: 4.8%;
  right: 4.8%;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 15px 16px;
  border: 1px solid #ffffff24;
  border-radius: 27px;
  background: #23201db8;
  box-shadow: 0 8px 25px #0002;
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
}

.wa-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #20c967;
  color: white;
}

.wa-icon svg {
  width: 36px;
  height: 36px;
}

.notif-copy {
  flex: 1;
  min-width: 0;
}

.notif-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.sender {
  font-size: 16px;
  font-weight: 650;
  flex: 1;
}

.now {
  font-size: 13px;
  color: #e0dcd8;
  opacity: .8;
}

.message {
  font-size: 16px;
  line-height: 1.4;
}

/* BOTTOM BUTTONS */
.bottom {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 25px);
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bottom-row {
  width: 100%;
  padding: 0 10.5%;
  display: flex;
  justify-content: space-between;
}

.shortcut {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #1c1a1891;
  color: white;
}

.shortcut svg {
  width: 28px;
  height: 28px;
}

.hint {
  margin-top: 17px;
  font-size: 15px;
  color: #ffffffcc;
  text-shadow: 0 1px 5px #0008;
}

.home-indicator {
  margin-top: 40px;
  width: 34%;
  max-width: 145px;
  height: 5px;
  border-radius: 10px;
  background: white;
}

@media (max-height: 700px) {
  .clock-area { top: 75px; }
  .clock {
    font-size: clamp(78px, 20vh, 105px);
    margin-top: 8px;
  }
  .notification {
    top: 39%;
    padding: 11px 13px;
  }
  .shortcut {
    width: 52px;
    height: 52px;
  }
  .bottom {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
  }
  .hint { margin-top: 10px; }
  .home-indicator { margin-top: 18px; }
}
</style>
</head>

<body>
<main class="lock-screen">

  <header class="status-bar">
    <span>Sagara</span>

    <div class="status-icons">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>

      <svg class="wifi" viewBox="0 0 24 18">
        <path d="M2 6.5C7.8 1.5 16.2 1.5 22 6.5
          M5.5 10C9.3 6.8 14.7 6.8 18.5 10
          M9.2 13.5c1.7-1.4 3.9-1.4 5.6 0"
          fill="none" stroke="white" stroke-width="2.8"
          stroke-linecap="round"/>
      </svg>

      <span class="battery">
        <span class="battery-fill"></span>
      </span>
    </div>
  </header>

  <section class="clock-area">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
  </section>

  <section class="notification">
    <span class="wa-icon">
      <svg viewBox="0 0 32 32" aria-label="WhatsApp">
        <path fill="currentColor" d="
          M16 2.2A13.3 13.3 0 0 0 4.5 22.2L2.8 29
          l7-1.8A13.3 13.3 0 1 0 16 2.2Zm0 24.1
          a10.8 10.8 0 0 1-5.5-1.5l-.5-.3-4.1 1.1
          1.1-4-.3-.5A10.8 10.8 0 1 1 16 26.3Zm5.9-8.1
          c-.3-.2-1.9-.9-2.2-1s-.5-.2-.8.2-.9 1.1-1.1
          1.3-.4.2-.7.1a8.9 8.9 0 0 1-2.6-1.6
          9.8 9.8 0 0 1-1.8-2.3c-.2-.3 0-.5.2-.7
          l.5-.6c.2-.2.3-.4.4-.6s0-.4 0-.6-.8-1.8-1.1-2.5
          c-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.6.1-.9.4
          s-1.3 1.3-1.3 3 .1 1.9 1.5 3.6a13.3 13.3 0 0 0
          5.1 4.6c.7.3 1.3.6 1.8.7.7.2 1.4.2 1.9.1
          .6-.1 2-.8 2.3-1.5s.3-1.4.2-1.5-.3-.3-.6-.5Z"/>
      </svg>
    </span>

    <div class="notif-copy">
      <div class="notif-top">
        <span class="sender">Arelian</span>
        <span class="now">now</span>
      </div>
      <div class="message">saga, udah dimana?</div>
    </div>
  </section>

  <footer class="bottom">
    <div class="bottom-row">
      <div class="shortcut" aria-label="Senter">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 2h8v3l-1.2 2v12.5a3 3 0 0 1-6 0V7L8 5V2Z"/>
        </svg>
      </div>

      <div class="shortcut" aria-label="Kamera">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8">
          <path d="M4 7h3l1.5-2h7L17 7h3
            a1.5 1.5 0 0 1 1.5 1.5v9
            A1.5 1.5 0 0 1 20 19H4
            a1.5 1.5 0 0 1-1.5-1.5v-9
            A1.5 1.5 0 0 1 4 7Z"/>
          <circle cx="12" cy="12.5" r="4"/>
        </svg>
      </div>
    </div>

    <div class="hint">Swipe up to open</div>
    <div class="home-indicator"></div>
  </footer>

</main>

<script>
const clock = document.getElementById("clock");
const date = document.getElementById("date");

function updateClock() {
  const now = new Date();

  clock.textContent = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(now);

  date.textContent = new Intl.DateTimeFormat("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).format(now);
}

updateClock();
setInterval(updateClock, 30000);
</script>

</body>
</html>
