
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagara's iPhone</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #211b17;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  overflow: hidden;
}

.lock-screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: #54463b url("wallpaper-saga.jpeg") center / cover no-repeat;
}

.lock-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    #160f0c66 0%,
    #160f0c10 30%,
    #160f0c12 65%,
    #160f0c55 100%
  );
}

/* STATUS BAR */
.status-bar {
  position: absolute;
  top: max(env(safe-area-inset-top), 14px);
  left: 7.5%;
  right: 7.5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 5px #0008;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 14px;
}

.signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 14px; }

.wifi {
  width: 19px;
  height: 15px;
}

.battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2.5px;
  height: 4px;
  background: white;
}

.battery-fill {
  display: block;
  width: 76%;
  height: 100%;
  background: white;
}

/* CLOCK */
.clock-area {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12vh);
  left: 0;
  right: 0;
  text-align: center;
  text-shadow: 0 2px 12px #0005;
}

.date {
  font-size: clamp(16px, 4.4vw, 23px);
  font-weight: 450;
}

.clock {
  margin-top: 14px;
  font-size: clamp(92px, 25vw, 138px);
  line-height: .98;
  font-weight: 200;
  letter-spacing: -6px;
  font-variant-numeric: tabular-nums;
}

/* WHATSAPP NOTIFICATION */
.notification {
  position: absolute;
  top: 38.5%;
  left: 4.8%;
  right: 4.8%;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 15px 16px;
  border: 1px solid #ffffff24;
  border-radius: 27px;
  background: #23201db8;
  box-shadow: 0 8px 25px #0002;
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
}

.wa-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #20c967;
  color: white;
}

.wa-icon svg {
  width: 36px;
  height: 36px;
}

.notif-copy {
  flex: 1;
  min-width: 0;
}

.notif-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.sender {
  font-size: 16px;
  font-weight: 650;
  flex: 1;
}

.now {
  font-size: 13px;
  color: #e0dcd8;
  opacity: .8;
}

.message {
  font-size: 16px;
  line-height: 1.4;
}

/* BOTTOM BUTTONS */
.bottom {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 25px);
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bottom-row {
  width: 100%;
  padding: 0 10.5%;
  display: flex;
  justify-content: space-between;
}

.shortcut {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #1c1a1891;
  color: white;
}

.shortcut svg {
  width: 28px;
  height: 28px;
}

.hint {
  margin-top: 17px;
  font-size: 15px;
  color: #ffffffcc;
  text-shadow: 0 1px 5px #0008;
}

.home-indicator {
  margin-top: 40px;
  width: 34%;
  max-width: 145px;
  height: 5px;
  border-radius: 10px;
  background: white;
}

@media (max-height: 700px) {
  .clock-area { top: 75px; }
  .clock {
    font-size: clamp(78px, 20vh, 105px);
    margin-top: 8px;
  }
  .notification {
    top: 39%;
    padding: 11px 13px;
  }
  .shortcut {
    width: 52px;
    height: 52px;
  }
  .bottom {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
  }
  .hint { margin-top: 10px; }
  .home-indicator { margin-top: 18px; }
}

/* PASSCODE SCREEN */
.passcode-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 24px;
  text-align: center;
  background: rgba(25, 22, 21, .48);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  transition: opacity .25s ease;
}

.passcode-screen.hidden {
  display: none;
}

.passcode-title {
  font-size: 21px;
  font-weight: 600;
  margin-bottom: 10px;
}

.passcode-subtitle {
  font-size: 13px;
  opacity: .85;
  margin-bottom: 28px;
}

.passcode-dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin-bottom: 32px;
}

.passcode-dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.passcode-dot.filled {
  background: white;
}

.passcode-keypad {
  width: min(270px, 85vw);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px 18px;
}

.passcode-key {
  width: 68px;
  height: 68px;
  margin: auto;
  border: 1px solid #ffffff20;
  border-radius: 50%;
  background: #ffffff20;
  color: white;
  font-size: 27px;
  font-weight: 300;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.passcode-key:active {
  background: #ffffff55;
}

.passcode-key small {
  display: block;
  font-size: 8px;
  letter-spacing: 1px;
}

.passcode-bottom {
  position: absolute;
  bottom: max(env(safe-area-inset-bottom), 25px);
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 35px;
  font-size: 14px;
}

.passcode-bottom button {
  border: 0;
  background: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.passcode-error {
  height: 20px;
  margin-top: 12px;
  font-size: 12px;
}

@media (max-height: 700px) {
  .passcode-keypad {
    gap: 9px 14px;
  }

  .passcode-key {
    width: 57px;
    height: 57px;
  }

  .passcode-dots {
    margin-bottom: 22px;
  }
}

/* HOME SCREEN */
.home-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  overflow: hidden;
  padding: max(env(safe-area-inset-top), 18px) 22px 24px;
  background: #33251e url("wallpaper-saga.jpeg") center / cover no-repeat;
}

.home-screen.active {
  display: flex;
  flex-direction: column;
}


.home-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 7.5% 28px;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 5px #0008;
  min-height: 18px;
}

.home-status .status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.home-status .signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 14px;
}

.home-status .signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.home-status .signal i:nth-child(1) { height: 5px; }
.home-status .signal i:nth-child(2) { height: 8px; }
.home-status .signal i:nth-child(3) { height: 11px; }
.home-status .signal i:nth-child(4) { height: 14px; }

.home-status .wifi {
  width: 19px;
  height: 15px;
}

.home-status .battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.home-status .battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2.5px;
  height: 4px;
  background: white;
}

.home-status .battery-fill {
  display: block;
  width: 76%;
  height: 100%;
  background: white;
}

.weather-widget {
  min-height: 155px;
  padding: 20px;
  border-radius: 25px;
  background: #ffffff30;
  border: 1px solid #ffffff24;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px #0002;
}

.weather-city {
  font-size: 19px;
}

.weather-temp {
  font-size: 54px;
  font-weight: 300;
  line-height: 1.15;
}

.weather-desc {
  font-size: 15px;
}

.weather-label {
  text-align: center;
  margin: 8px 0 22px;
  font-size: 13px;
}

  min-height: 155px;
  padding: 20px;
  border-radius: 25px;
  background: #ffffff30;
  border: 1px solid #ffffff24;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px #0002;
}

.weather-city {
  font-size: 19px;
}

.weather-temp {
  font-size: 54px;
  font-weight: 300;
  line-height: 1.15;
}

.weather-desc {
  font-size: 15px;
}

.weather-label {
  text-align: center;
  margin: 8px 0 22px;
  font-size: 13px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 22px 8px;
}

.app {
  border: 0;
  padding: 0;
  background: transparent;
  color: white;
  font: inherit;
  text-align: center;
  min-width: 0;
}


/* IOS-STYLE APP ICONS */
.app-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: 0 auto 5px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 2px 7px #0002;
}

.app-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.app-name {
  display: block;
  font-size: 11px;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 4px #000;
}

.dock-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: auto;
  border-radius: 14px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #fff;
}

.dock-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.home-spacer {
  flex: 1;
  min-height: 20px;
}

.page-dots {
  text-align: center;
  letter-spacing: 9px;
  margin: 12px 0 16px;
  font-size: 14px;
}

.home-dock {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 13px 8px;
  border-radius: 27px;
  background: #ffffff30;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.dock-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: auto;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: #f7f7f7;
  font-size: 29px;
}

.dock-icon.phone,
.dock-icon.messages { background: #19c75a; }
.dock-icon.music { background: #f23854; color: white; }

.home-bottom-line {
  width: 35%;
  max-width: 135px;
  height: 5px;
  border-radius: 10px;
  background: white;
  margin: 18px auto 0;
}

@media (max-height: 740px) {
  .home-status { margin-bottom: 16px; }
  .weather-widget { min-height: 125px; padding: 14px; }
  .weather-temp { font-size: 43px; }
  .weather-label { margin-bottom: 14px; }
  .app-grid { gap: 13px 6px; }
  .home-dock { padding: 9px 6px; }
}


/* ===== WHATSAPP IOS LIGHT ===== */
.whatsapp-screen {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
  flex-direction: column;
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  color: #111;
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.whatsapp-screen.active {
  display: flex;
}

.wa-header {
  min-height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 16px;
  background: #fff;
}

.wa-header h2 {
  margin: 0;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.wa-header button,
.wa-back {
  border: 0;
  background: transparent;
  color: #087f45;
  font-size: 16px;
  cursor: pointer;
}

.wa-header .wa-back {
  font-size: 15px;
  white-space: nowrap;
}

.wa-tools {
  display: flex;
  align-items: center;
  gap: 18px;
  color: #087f45;
  font-size: 25px;
}

.wa-search {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 16px 12px;
  padding: 0 11px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 10px;
  background: #efeff0;
  color: #777;
}

.wa-search input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #111;
  font: inherit;
  font-size: 16px;
}

.wa-section-title {
  padding: 7px 17px 10px;
  color: #777;
  font-size: 12px;
  font-weight: 600;
  border-bottom: 1px solid #eee;
}

.wa-chat-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  background: #fff;
}

.wa-chat {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border: 0;
  background: #fff;
  text-align: left;
  color: #111;
  cursor: pointer;
}

.wa-chat:active {
  background: #f0f0f0;
}

.wa-avatar {
  width: 50px;
  height: 50px;
  flex: 0 0 50px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 23px;
  color: white;
  background: #b5a18d;
}

.wa-avatar.group {
  background: #6aa98a;
}

.wa-chat-info {
  flex: 1;
  min-width: 0;
  padding: 4px 0 13px;
  border-bottom: 1px solid #ededed;
}

.wa-chat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}

.wa-chat-name {
  font-size: 16px;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.wa-chat-time {
  flex-shrink: 0;
  font-size: 11px;
  color: #888;
}

.wa-chat-preview {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  color: #777;
}

.wa-bottom {
  min-height: 64px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 2px calc(env(safe-area-inset-bottom, 0px) + 9px);
  background: #fafafa;
  border-top: 1px solid #e5e5e5;
}

.wa-bottom button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border: 0;
  background: transparent;
  color: #888;
  font-size: 10px;
}

.wa-bottom button b {
  font-size: 21px;
  line-height: 1;
}

.wa-bottom button.selected {
  color: #087f45;
}

/* LAYAR PERCAKAPAN */
.wa-conversation {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #fff;
}

.wa-conversation[hidden] {
  display: none !important;
}

.wa-conversation-header {
  min-height: 61px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid #eee;
  background: #fff;
}

.wa-conversation-header .wa-back {
  font-size: 28px;
  line-height: 1;
  white-space: nowrap;
}

.wa-back span {
  font-size: 14px;
}

.wa-contact-heading {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.wa-contact-heading .wa-avatar {
  width: 37px;
  height: 37px;
  flex-basis: 37px;
  font-size: 17px;
}

.wa-contact-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
  font-weight: 650;
}

.wa-contact-status {
  margin-top: 2px;
  font-size: 11px;
  color: #777;
}

.wa-call-actions {
  display: flex;
  align-items: center;
  gap: 13px;
}

.wa-call-actions button {
  border: 0;
  background: transparent;
  color: #087f45;
  font-size: 21px;
}

.wa-messages-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 10px 18px;
  background-color: #efe9df;
  background-image:
    radial-gradient(circle at 20% 30%, #ffffff45 0 2px, transparent 3px),
    radial-gradient(circle at 75% 65%, #d6cdbd55 0 3px, transparent 4px);
  background-size: 35px 35px, 48px 48px;
}

.wa-date-pill {
  width: fit-content;
  margin: 0 auto 16px;
  padding: 5px 12px;
  border-radius: 8px;
  background: #ffffffdf;
  color: #777;
  font-size: 11px;
}

.wa-message-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.wa-bubble {
  max-width: 83%;
  padding: 8px 9px 5px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 1px #00000010;
}

.wa-bubble.received {
  align-self: flex-start;
  background: #fff;
  border-top-left-radius: 3px;
}

.wa-bubble.sent {
  align-self: flex-end;
  background: #d9fdd3;
  border-top-right-radius: 3px;
}

.wa-bubble-time {
  display: block;
  margin-top: 3px;
  color: #777;
  font-size: 10px;
  text-align: right;
}

.wa-compose {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 10px calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid #e5e5e5;
  background: #f8f8f8;
  flex-shrink: 0;
}

.wa-compose button {
  border: 0;
  background: transparent;
  color: #087f45;
  font-size: 25px;
  cursor: pointer;
  flex-shrink: 0;
}

.wa-compose input {
  flex: 1;
  min-width: 0;
  padding: 10px 13px;
  border: 1px solid #ddd;
  border-radius: 22px;
  outline: none;
  background: #fff;
  color: #111;
  font-size: 15px;
}

.wa-compose .wa-send {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #087f45;
  color: white;
  font-size: 19px;
}
</style>
</head>

  <header class="status-bar">

    <div class="status-icons">

          stroke-linecap="round"/>
      </svg>

      <span class="battery">
        <span class="battery-fill"></span>
      </span>
    </div>

  <section class="clock-area">
    <div class="date" id="date"></div>

  <section class="notification">

<script>
const clock = document.getElementById("clock");
const date = document.getElementById("date");

function updateClock() {
  const now = new Date();

  clock.textContent = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(now);

  date.textContent = new Intl.DateTimeFormat("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).format(now);
}

updateClock();
setInterval(updateClock, 30000);
</script>

<script>
(() => {
  const lockScreen = document.querySelector(".lock-screen");
  const passScreen = document.getElementById("passcodeScreen");
  const hint = document.querySelector(".hint");
  const dots = [...document.querySelectorAll(".passcode-dot")];
  const error = document.getElementById("passcodeError");

  let enteredCode = "";
  const correctCode = "060609";

  function openPasscode() {
    passScreen.classList.remove("hidden");
    enteredCode = "";
    updateDots();
    error.textContent = "";
  }

  function closePasscode() {
    passScreen.classList.add("hidden");
    enteredCode = "";
    updateDots();
    error.textContent = "";
  }

  function updateDots() {
    dots.forEach((dot, index) => {
      dot.classList.toggle("filled", index < enteredCode.length);
    });
  }

  function enterDigit(digit) {
    if (enteredCode.length >= 6) return;

    enteredCode += digit;
    updateDots();

    if (enteredCode.length === 6) {
      if (enteredCode === correctCode) {
        error.textContent = "Passcode correct!";
        error.style.color = "#a8f0b6";

        // Nanti hubungkan ke home screen Sagara.
       
setTimeout(() => {
  passScreen.classList.add("hidden");
  lockScreen.style.display = "none";
  document.getElementById("homeScreen").classList.add("active");
}, 350);

      } else {
        error.textContent = "Incorrect Passcode. Try again.";
        error.style.color = "#ffb6b6";

        setTimeout(() => {
          enteredCode = "";
          updateDots();
          error.textContent = "";
        }, 800);
      }
    }
  }

  document.querySelectorAll("[data-digit]").forEach(button => {
    button.addEventListener("click", () => {
      enterDigit(button.dataset.digit);
    });
  });

  document.getElementById("deleteDigit")
    .addEventListener("click", () => {
      enteredCode = enteredCode.slice(0, -1);
      updateDots();
      error.textContent = "";
    });

  document.getElementById("cancelPasscode")
    .addEventListener("click", closePasscode);

  document.getElementById("useFaceID")
    .addEventListener("click", () => {
      error.style.color = "white";
      error.textContent = "Face ID is unavailable in this demo.";
    });

  // Swipe up pada lockscreen untuk membuka passcode.
  let startY = 0;

  lockScreen.addEventListener("touchstart", event => {
    if (!passScreen.classList.contains("hidden")) return;
    startY = event.touches[0].clientY;
  }, { passive: true });

  lockScreen.addEventListener("touchend", event => {
    if (!passScreen.classList.contains("hidden")) return;

    const endY = event.changedTouches[0].clientY;

    if (startY - endY > 45) {
      openPasscode();
    }
  }, { passive: true });

  // Klik tulisan hint juga membuka passcode.
  hint.addEventListener("click", openPasscode);
})();
</script>

let waCurrentChat = null;

function waEscapeText(value) {
  const span = document.createElement("span");
  span.textContent = value;
  return span.innerHTML;
}

function waRenderMessages() {
  if (!waCurrentChat) return;

  const chat = waChatData[waCurrentChat];

  waMessages.innerHTML = chat.messages.map(([direction, text, time]) => `
    <div class="wa-bubble ${direction}">
      ${waEscapeText(text)}
      <span class="wa-bubble-time">
        ${time || "09.41"}${direction === "sent" ? " ✓✓" : ""}
      </span>
    </div>
  `).join("");

  waMessagesArea.scrollTop = waMessagesArea.scrollHeight;

  const matchingButton = [...waChatList.querySelectorAll("[data-chat]")]
    .find(button => button.dataset.chat === waCurrentChat);

  if (matchingButton && chat.messages.length) {
    const lastMessage = chat.messages[chat.messages.length - 1][1];
    const preview = matchingButton.querySelector(".wa-chat-preview");
    if (preview) preview.textContent = lastMessage;
  }
}

function waOpenConversation(name) {
  if (!waChatData[name]) return;

  waCurrentChat = name;
  const chat = waChatData[name];

  waContactName.textContent = name;
  waContactAvatar.textContent = chat.avatar;
  waContactAvatar.style.background = chat.color;
  waContactStatus.textContent = chat.status;

  waListView.style.display = "none";
  waConversation.hidden = false;

  waRenderMessages();
}

function waShowChatList() {
  waConversation.hidden = true;
  waListView.style.display = "flex";
  waCurrentChat = null;
}

function waFilterChats() {
  const query = waSearch.value.toLowerCase().trim();

  waChatList.querySelectorAll("[data-chat]").forEach(button => {
    const name = button.dataset.chat.toLowerCase();
    const preview = button.querySelector(".wa-chat-preview")
      .textContent.toLowerCase();

    button.style.display =
      name.includes(query) || preview.includes(query) ? "flex" : "none";
  });
}

waChatList.addEventListener("click", event => {
  const button = event.target.closest("[data-chat]");
  if (button) waOpenConversation(button.dataset.chat);
});

waChatBack.addEventListener("click", waShowChatList);

waSearch.addEventListener("input", waFilterChats);

waCompose.addEventListener("submit", event => {
  event.preventDefault();

  const message = waMessageInput.value.trim();
  if (!message || !waCurrentChat) return;

  const time = new Date().toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  waChatData[waCurrentChat].messages.push(["sent", message, time]);

  waMessageInput.value = "";
  waRenderMessages();
});

whatsappApp.addEventListener("click", () => {
  whatsappScreen.classList.add("active");
  waShowChatList();
  waSearch.value = "";
  waFilterChats();
});

waBack.addEventListener("click", () => {
  whatsappScreen.classList.remove("active");
  waShowChatList();
});
</script>
