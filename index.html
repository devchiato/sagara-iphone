
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagara's iPhone</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #211b17;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  overflow: hidden;
}

.lock-screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: #54463b url("wallpaper-saga.jpeg") center / cover no-repeat;
}

.lock-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    #160f0c66 0%,
    #160f0c10 30%,
    #160f0c12 65%,
    #160f0c55 100%
  );
}

/* STATUS BAR */
.status-bar {
  position: absolute;
  top: max(env(safe-area-inset-top), 14px);
  left: 7.5%;
  right: 7.5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 5px #0008;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 14px;
}

.signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.signal i:nth-child(1) { height: 5px; }
.signal i:nth-child(2) { height: 8px; }
.signal i:nth-child(3) { height: 11px; }
.signal i:nth-child(4) { height: 14px; }

.wifi {
  width: 19px;
  height: 15px;
}

.battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2.5px;
  height: 4px;
  background: white;
}

.battery-fill {
  display: block;
  width: 76%;
  height: 100%;
  background: white;
}

/* CLOCK */
.clock-area {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12vh);
  left: 0;
  right: 0;
  text-align: center;
  text-shadow: 0 2px 12px #0005;
}

.date {
  font-size: clamp(16px, 4.4vw, 23px);
  font-weight: 450;
}

.clock {
  margin-top: 14px;
  font-size: clamp(92px, 25vw, 138px);
  line-height: .98;
  font-weight: 200;
  letter-spacing: -6px;
  font-variant-numeric: tabular-nums;
}

/* WHATSAPP NOTIFICATION */
.notification {
  position: absolute;
  top: 38.5%;
  left: 4.8%;
  right: 4.8%;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 15px 16px;
  border: 1px solid #ffffff24;
  border-radius: 27px;
  background: #23201db8;
  box-shadow: 0 8px 25px #0002;
  backdrop-filter: blur(26px);
  -webkit-backdrop-filter: blur(26px);
}

.wa-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: #20c967;
  color: white;
}

.wa-icon svg {
  width: 36px;
  height: 36px;
}

.notif-copy {
  flex: 1;
  min-width: 0;
}

.notif-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.sender {
  font-size: 16px;
  font-weight: 650;
  flex: 1;
}

.now {
  font-size: 13px;
  color: #e0dcd8;
  opacity: .8;
}

.message {
  font-size: 16px;
  line-height: 1.4;
}

/* BOTTOM BUTTONS */
.bottom {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom) + 25px);
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bottom-row {
  width: 100%;
  padding: 0 10.5%;
  display: flex;
  justify-content: space-between;
}

.shortcut {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #1c1a1891;
  color: white;
}

.shortcut svg {
  width: 28px;
  height: 28px;
}

.hint {
  margin-top: 17px;
  font-size: 15px;
  color: #ffffffcc;
  text-shadow: 0 1px 5px #0008;
}

.home-indicator {
  margin-top: 40px;
  width: 34%;
  max-width: 145px;
  height: 5px;
  border-radius: 10px;
  background: white;
}

@media (max-height: 700px) {
  .clock-area { top: 75px; }
  .clock {
    font-size: clamp(78px, 20vh, 105px);
    margin-top: 8px;
  }
  .notification {
    top: 39%;
    padding: 11px 13px;
  }
  .shortcut {
    width: 52px;
    height: 52px;
  }
  .bottom {
    bottom: calc(env(safe-area-inset-bottom) + 12px);
  }
  .hint { margin-top: 10px; }
  .home-indicator { margin-top: 18px; }
}

/* PASSCODE SCREEN */
.passcode-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 24px;
  text-align: center;
  background: rgba(25, 22, 21, .48);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  transition: opacity .25s ease;
}

.passcode-screen.hidden {
  display: none;
}

.passcode-title {
  font-size: 21px;
  font-weight: 600;
  margin-bottom: 10px;
}

.passcode-subtitle {
  font-size: 13px;
  opacity: .85;
  margin-bottom: 28px;
}

.passcode-dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin-bottom: 32px;
}

.passcode-dot {
  width: 11px;
  height: 11px;
  border: 1px solid white;
  border-radius: 50%;
}

.passcode-dot.filled {
  background: white;
}

.passcode-keypad {
  width: min(270px, 85vw);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px 18px;
}

.passcode-key {
  width: 68px;
  height: 68px;
  margin: auto;
  border: 1px solid #ffffff20;
  border-radius: 50%;
  background: #ffffff20;
  color: white;
  font-size: 27px;
  font-weight: 300;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.passcode-key:active {
  background: #ffffff55;
}

.passcode-key small {
  display: block;
  font-size: 8px;
  letter-spacing: 1px;
}

.passcode-bottom {
  position: absolute;
  bottom: max(env(safe-area-inset-bottom), 25px);
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 35px;
  font-size: 14px;
}

.passcode-bottom button {
  border: 0;
  background: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.passcode-error {
  height: 20px;
  margin-top: 12px;
  font-size: 12px;
}

@media (max-height: 700px) {
  .passcode-keypad {
    gap: 9px 14px;
  }

  .passcode-key {
    width: 57px;
    height: 57px;
  }

  .passcode-dots {
    margin-bottom: 22px;
  }
}

/* HOME SCREEN */
.home-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  overflow: hidden;
  padding: max(env(safe-area-inset-top), 18px) 22px 24px;
  background: #33251e url("wallpaper-saga.jpeg") center / cover no-repeat;
}

.home-screen.active {
  display: flex;
  flex-direction: column;
}


.home-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 4px 7.5% 28px;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 5px #0008;
  min-height: 18px;
}

.home-status .status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

.home-status .signal {
  display: flex;
  align-items: end;
  gap: 2px;
  height: 14px;
}

.home-status .signal i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px;
}

.home-status .signal i:nth-child(1) { height: 5px; }
.home-status .signal i:nth-child(2) { height: 8px; }
.home-status .signal i:nth-child(3) { height: 11px; }
.home-status .signal i:nth-child(4) { height: 14px; }

.home-status .wifi {
  width: 19px;
  height: 15px;
}

.home-status .battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid white;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
}

.home-status .battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2.5px;
  height: 4px;
  background: white;
}

.home-status .battery-fill {
  display: block;
  width: 76%;
  height: 100%;
  background: white;
}

}

.weather-widget {
  min-height: 155px;
  padding: 20px;
  border-radius: 25px;
  background: #ffffff30;
  border: 1px solid #ffffff24;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px #0002;
}

.weather-city {
  font-size: 19px;
}

.weather-temp {
  font-size: 54px;
  font-weight: 300;
  line-height: 1.15;
}

.weather-desc {
  font-size: 15px;
}

.weather-label {
  text-align: center;
  margin: 8px 0 22px;
  font-size: 13px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 22px 8px;
}

.app {
  border: 0;
  padding: 0;
  background: transparent;
  color: white;
  font: inherit;
  text-align: center;
  min-width: 0;
}


/* IOS-STYLE APP ICONS */
.app-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: 0 auto 5px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 2px 7px #0002;
}

.app-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.app-name {
  display: block;
  font-size: 11px;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 4px #000;
}

.dock-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: auto;
  border-radius: 14px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #fff;
}

.dock-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.home-spacer {
  flex: 1;
  min-height: 20px;
}

.page-dots {
  text-align: center;
  letter-spacing: 9px;
  margin: 12px 0 16px;
  font-size: 14px;
}

.home-dock {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 13px 8px;
  border-radius: 27px;
  background: #ffffff30;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.dock-icon {
  width: min(16vw, 62px);
  height: min(16vw, 62px);
  margin: auto;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: #f7f7f7;
  font-size: 29px;
}

.dock-icon.phone,
.dock-icon.messages { background: #19c75a; }
.dock-icon.music { background: #f23854; color: white; }

.home-bottom-line {
  width: 35%;
  max-width: 135px;
  height: 5px;
  border-radius: 10px;
  background: white;
  margin: 18px auto 0;
}

@media (max-height: 740px) {
  .home-status { margin-bottom: 16px; }
  .weather-widget { min-height: 125px; padding: 14px; }
  .weather-temp { font-size: 43px; }
  .weather-label { margin-bottom: 14px; }
  .app-grid { gap: 13px 6px; }
  .home-dock { padding: 9px 6px; }
}
</style>
</head>

<body>
<main class="lock-screen">

  <header class="status-bar">
    <span>Sagara</span>

    <div class="status-icons">
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>

      <svg class="wifi" viewBox="0 0 24 18">
        <path d="M2 6.5C7.8 1.5 16.2 1.5 22 6.5
          M5.5 10C9.3 6.8 14.7 6.8 18.5 10
          M9.2 13.5c1.7-1.4 3.9-1.4 5.6 0"
          fill="none" stroke="white" stroke-width="2.8"
          stroke-linecap="round"/>
      </svg>

      <span class="battery">
        <span class="battery-fill"></span>
      </span>
    </div>
  </header>

  <section class="clock-area">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
  </section>

  <section class="notification">
    <span class="wa-icon">
      <svg viewBox="0 0 32 32" aria-label="WhatsApp">
        <path fill="currentColor" d="
          M16 2.2A13.3 13.3 0 0 0 4.5 22.2L2.8 29
          l7-1.8A13.3 13.3 0 1 0 16 2.2Zm0 24.1
          a10.8 10.8 0 0 1-5.5-1.5l-.5-.3-4.1 1.1
          1.1-4-.3-.5A10.8 10.8 0 1 1 16 26.3Zm5.9-8.1
          c-.3-.2-1.9-.9-2.2-1s-.5-.2-.8.2-.9 1.1-1.1
          1.3-.4.2-.7.1a8.9 8.9 0 0 1-2.6-1.6
          9.8 9.8 0 0 1-1.8-2.3c-.2-.3 0-.5.2-.7
          l.5-.6c.2-.2.3-.4.4-.6s0-.4 0-.6-.8-1.8-1.1-2.5
          c-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.6.1-.9.4
          s-1.3 1.3-1.3 3 .1 1.9 1.5 3.6a13.3 13.3 0 0 0

          .6-.1 2-.8 2.3-1.5s.3-1.4.2-1.5-.3-.3-.6-.5Z"/>
      </svg>
    </span>

    <div class="notif-copy">
      <div class="notif-top">
        <span class="sender">Arelian</span>
        <span class="now">now</span>
      </div>
      <div class="message">saga, udah dimana?</div>
    </div>
  </section>

  <footer class="bottom">
    <div class="bottom-row">
      <div class="shortcut" aria-label="Senter">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 2h8v3l-1.2 2v12.5a3 3 0 0 1-6 0V7L8 5V2Z"/>
        </svg>
      </div>

      <div class="shortcut" aria-label="Kamera">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8">
          <path d="M4 7h3l1.5-2h7L17 7h3
            a1.5 1.5 0 0 1 1.5 1.5v9
            A1.5 1.5 0 0 1 20 19H4
            a1.5 1.5 0 0 1-1.5-1.5v-9
            A1.5 1.5 0 0 1 4 7Z"/>
          <circle cx="12" cy="12.5" r="4"/>
        </svg>
      </div>
    </div>

    <div class="hint">Swipe up to open</div>
    <div class="home-indicator"></div>
  </footer>

  <!-- ENTER PASSCODE -->
  <section class="passcode-screen hidden" id="passcodeScreen">

    <div class="passcode-title">
      Enter Passcode
    </div>

    <div class="passcode-subtitle">
      Swipe up for Face ID or Enter Passcode
    </div>

    <div class="passcode-dots" id="passcodeDots">
      <span class="passcode-dot"></span>
      <span class="passcode-dot"></span>
      <span class="passcode-dot"></span>
      <span class="passcode-dot"></span>
      <span class="passcode-dot"></span>
      <span class="passcode-dot"></span>
    </div>

    <div class="passcode-keypad">
      <button class="passcode-key" data-digit="1">1</button>
      <button class="passcode-key" data-digit="2">2<small>ABC</small></button>
      <button class="passcode-key" data-digit="3">3<small>DEF</small></button>
      <button class="passcode-key" data-digit="4">4<small>GHI</small></button>
      <button class="passcode-key" data-digit="5">5<small>JKL</small></button>
      <button class="passcode-key" data-digit="6">6<small>MNO</small></button>
      <button class="passcode-key" data-digit="7">7<small>PQRS</small></button>
      <button class="passcode-key" data-digit="8">8<small>TUV</small></button>
      <button class="passcode-key" data-digit="9">9<small>WXYZ</small></button>
      <span></span>
      <button class="passcode-key" data-digit="0">0</button>
      <button class="passcode-key" id="deleteDigit" aria-label="Hapus angka">⌫</button>
    </div>

    <div class="passcode-error" id="passcodeError"></div>

    <div class="passcode-bottom">
      <button id="cancelPasscode">Cancel</button>
      <button id="useFaceID">Face ID</button>
    </div>

  </section>
</main>

<script>
const clock = document.getElementById("clock");
const date = document.getElementById("date");

function updateClock() {
  const now = new Date();

  clock.textContent = new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(now);

  date.textContent = new Intl.DateTimeFormat("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).format(now);
}

updateClock();
setInterval(updateClock, 30000);
</script>

<script>
(() => {
  const lockScreen = document.querySelector(".lock-screen");
  const passScreen = document.getElementById("passcodeScreen");
  const hint = document.querySelector(".hint");
  const dots = [...document.querySelectorAll(".passcode-dot")];
  const error = document.getElementById("passcodeError");

  let enteredCode = "";
  const correctCode = "060609";

  function openPasscode() {
    passScreen.classList.remove("hidden");
    enteredCode = "";
    updateDots();
    error.textContent = "";
  }

  function closePasscode() {
    passScreen.classList.add("hidden");
    enteredCode = "";
    updateDots();
    error.textContent = "";
  }

  function updateDots() {
    dots.forEach((dot, index) => {
      dot.classList.toggle("filled", index < enteredCode.length);
    });
  }

  function enterDigit(digit) {
    if (enteredCode.length >= 6) return;

    enteredCode += digit;
    updateDots();

    if (enteredCode.length === 6) {
      if (enteredCode === correctCode) {
        error.textContent = "Passcode correct!";
        error.style.color = "#a8f0b6";

        // Nanti hubungkan ke home screen Sagara.
       
setTimeout(() => {
  passScreen.classList.add("hidden");
  lockScreen.style.display = "none";
  document.getElementById("homeScreen").classList.add("active");
}, 350);

      } else {
        error.textContent = "Incorrect Passcode. Try again.";
        error.style.color = "#ffb6b6";

        setTimeout(() => {
          enteredCode = "";
          updateDots();
          error.textContent = "";
        }, 800);
      }
    }
  }

  document.querySelectorAll("[data-digit]").forEach(button => {
    button.addEventListener("click", () => {
      enterDigit(button.dataset.digit);
    });
  });

  document.getElementById("deleteDigit")
    .addEventListener("click", () => {
      enteredCode = enteredCode.slice(0, -1);
      updateDots();
      error.textContent = "";
    });

  document.getElementById("cancelPasscode")
    .addEventListener("click", closePasscode);

  document.getElementById("useFaceID")
    .addEventListener("click", () => {
      error.style.color = "white";
      error.textContent = "Face ID is unavailable in this demo.";
    });

  // Swipe up pada lockscreen untuk membuka passcode.
  let startY = 0;

  lockScreen.addEventListener("touchstart", event => {
    if (!passScreen.classList.contains("hidden")) return;
    startY = event.touches[0].clientY;
  }, { passive: true });

  lockScreen.addEventListener("touchend", event => {
    if (!passScreen.classList.contains("hidden")) return;

    const endY = event.changedTouches[0].clientY;

    if (startY - endY > 45) {
      openPasscode();
    }
  }, { passive: true });

  // Klik tulisan hint juga membuka passcode.
  hint.addEventListener("click", openPasscode);
})();
</script>
